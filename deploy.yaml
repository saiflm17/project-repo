---
apiVersion: apps/v1
kind: Deployment
metadata:
   name: app-pods
spec:
   replicas: 4
   selector:
     matchLabels:
       app: myapp
   template:
     metadata:
       labels:
          app: myapp
     spec:
       containers:
        - name: app-container
          image: saikumar1817/sai:applicationimage
          ports:
          - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
   name: devopsapp
spec:
   type: LoadBalancer
   selector:
      app: myapp
   ports:
   - port: 8080
     targetPort: 8080
